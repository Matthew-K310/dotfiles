# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# See https://wiki.hyprland.org/Configuring/Monitors/
# Monitor configuration
# 4k dell monitor in 1440p
monitor=eDP-1,preferred,0x0,1
 
# 1080 on 4k monitor for video
# monitor=eDP-1,1920x1200,0x1080,1
# monitor=DP-2,1920x1080,0x0,1

# 4k dell monitor in 4k
# monitor=eDP-1,1920x1200,0x2160,1
# monitor=DP-2,3840x2160,0x0,1
 
# Ultrawide @ parents
# monitor=HDMI-A-1,2560x1080,0x0,1

# Automatically handle monitor hotplug
exec-once=~/.config/hypr/monitor-hotplug.sh

exec-once = hyprctl 
exec-once = waybar 
 
# Set SwayNC as the notification daemon
exec-once = swaync 
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = hypridle 
exec-once = swww-daemon &
exec-once = sleep 1 && swww img ~/cloud/photos/wallpapers/michael.jpg

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute apps at launch
exec-once = emacs & librewolf & thunderbird
# exec-once = bash -c emacs & firefox & thunderbird

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = kitty
# $menu = wofi --show drun
$menu = wmenu-run -f "JetBrainsMono Nerd Font 12"
$email = thunderbird
$browser = librewolf
$altbrowser = chromium
$emacs = emacs 
$fileManager = thunar
# $email = kitty -e bash -c "aerc"
# $fileManager2 =
# $yazi = kitty -e tmux new-session -d 'yazi' \; set-option remain-on-exit on \; attach &

# Some default env vars.
# Environment variables for cursor - CRITICAL for Hyprland
env = XCURSOR_THEME,Nordzy-cursors-white
env = XCURSOR_SIZE,24

# gtk theming
env = GTK_THEME=Nordic-darker-v40 thunar

exec = gsettings set org.gnome.desktop.interface gtk-theme "Nordic-darker"
exec = gsettings set org.gnome.desktop.wm.preferences theme "Nordic-darker"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

# Hyprcursor support (newer Hyprland versions)
env = HYPRCURSOR_THEME,Nordzy-cursors-white
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_delay = 200
    repeat_rate = 75

    follow_mouse = 1

    touchpad {
        natural_scroll = no
	    tap-to-click = no
        clickfinger_behavior = true
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    no_border_on_floating = true
    # cursor_inactive_timeout = 4
    no_focus_fallback = true
    resize_on_border = true

    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.inactive_border = rgba(D6D3CCaa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
  active_opacity = 1
  inactive_opacity = 0.85

    rounding = 3 
    
    blur {
        enabled = true
        size = 2
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }

}

animations {
    enabled = no

    # Smooth bezier curves
    bezier = myBezier, 0.05, 0.7, 0.1, 1.0
    bezier = easeOutQuint, 0.22, 1, 0.36, 1

    # Increased durations to make animations more noticeable
    animation = windows, 0.7, 4, myBezier, popin
    animation = windowsOut, 0.6, 3, default, popin 80%
    animation = border, 0.4, 3, default
    animation = fade, 0.4, 3, default
    animation = workspaces, 0.8, 3, easeOutQuint, slide
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

# master {
#     # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#     new_is_master = true
# }

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gesture = 3, horizontal, workspace
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    animate_mouse_windowdragging = true
    animate_manual_resizes = true
    disable_splash_rendering = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = 1.0
}

# Window rules for applications
windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
windowrulev2 = size 1280 720, class:^(kitty)$, title:^(kitty)$
windowrulev2 = suppressevent maximize, class:.* 
windowrulev2 = workspace 1, class:^(emacs)$
windowrulev2 = workspace 2, class:^(librewolf)$
windowrulev2 = workspace 2, class:^(chromium)$
# windowrulev2 = workspace 3, class:^(kitty)$
windowrulev2 = workspace 4, class:^(cider)$
windowrulev2 = workspace 5, class:^(betterbird)$
windowrulev2 = workspace 5, class:^(jitsi-meet)$
windowrulev2 = workspace 6, class:^(gimp)$
windowrulev2 = workspace 6, class:^(darktable)$
windowrulev2 = workspace 6, class:^(com.obsproject.Studio)$
windowrulev2 = opacity 0.95 0.85, class:^(Emacs)$
windowrulev2 = opacity 0.95 0.85, class:^(thunar)$

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Open wofi
bind = $mainMod, d, exec, $menu

# Open kitty
bind = $mainMod CTRL, RETURN, exec, $terminal

# Pick emojis
# bind = $mainMod, grave, exec, ~/.config/hypr/scripts/emoji_unicode.sh
bind = $mainMod, grave, exec, ~/.local/bin/wmenuunicode

# Emacs related
# Launch emacs
bind = $mainMod SHIFT, E, exec, emacs
# Launch vterm emacs buffer
# bind = $mainMod, E, exec, emacsclient -n -e '(my/new-frame-with-vterm)'
bind = $mainMod, Return, exec, ~/.config/hypr/scripts/emacs-launcher '(my-open-vterm-at-point)'
# Using universal launcher in emacs
# bind = $mainMod, SPACE, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (universal-launcher-popup))'
# Org capture from anywhere
# bind = $mainMod, C, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (org-capture))'
bind = $mainMod, C, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (org-capture))'
# vterm
bind = $mainMod SHIFT, T, exec, emacsclient -n -e '(my/new-frame-with-vterm)'
# bind = $mainMod, RETURN, exec, ~/.config/hypr/scripts/emacs-launcher '(my-open-vterm-at-point)'
# Dirvish file manager
bind = $mainMod, R, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (dirvish))'
# password store
bind = $mainMod SHIFT, D, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (pass))'
# Open bookmarks file
bind = $mainMod, B, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (find-file "~/org/bookmarks.org"))'
# Open calendar
bind = $mainMod CONTROL, C, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (=calendar))'
# Open MU4e
bind = $mainMod, E, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (=mu4e))'
# Open emms
bind = $mainMod, M, exec, $music
# Open elfeed
bind = $mainMod SHIFT, N, exec, $elfeed
# Open notes
bind = $mainMod CTRL, N, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (find-file "~/org/notes.org"))'
# Open org mode dashboard
bind = $mainMod, N, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (org-agenda nil "w"))'
# Emacs evreywhere in wayland
bind = $mainMod CONTROL, E, exec, emacsclient --eval '(thanos/type)'
# windowrulev2 = float,class:^(emacs)$,title:^(emacs-float)$ # Launch as a floating window.
windowrulev2 = float, title:^(emacs-float)$ # Launch as a floating window.

# Hyprland
# Lock Screen
bind = $mainMod CONTROL, Q, exec, hyprlock
# Open file manager
bind = $mainMod SHIFT, R, exec, $fileManager
# Open browser
bind = $mainMod, W, exec, $browser
bind = $mainMod SHIFT, W, exec, $altbrowser
# Open thunderbird
bind = $mainMod CONTROL SHIFT, E, exec, $email
# Open notification
bind = ALT CONTROL, n, exec, swaync-client -t -sw
# Screenshot
bind = $mainMod CONTROL, 3, exec, ~/.config/hypr/scripts/screenshot.sh full
bind = $mainMod CONTROL, 4, exec, ~/.config/hypr/scripts/screenshot.sh zone
# Hyprpicker color picker
bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod, G, exec, gimp
bind = $mainMod CONTROL, D, exec, darktable
bind = $mainMod SHIFT, M, exec, cider
bind = $mainMod CONTROL, M, exec, kitty -e bash -c "profanity"
# Wallpaper switcher
bind = $mainMod CONTROL, W, exec, ~/.config/hypr/scripts/swww.sh

bind = $mainMod, XF86AudioPlay, exec, ~/.config/hypr/scripts/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (bluetooth-list-devices))'
bindel = $mainMod, XF86LaunchA, exec, kitty -e bash -c "pulsemixer"

# Volume controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness controls
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind=,XF86MonBrightnessUp,exec,brightnessctl set +5%

# Mute and unmute:
bind = , XF86AudioMicMute, exec, amixer set Capture toggle

# Dictation toggle on F9
bind = , F9, exec, ~/.config/hypr/scripts/toggle-dictation.sh

#bind = $mainMod, B, exec, $HOME/.config/scripts/bookmarks/rofibookmark.sh
#bind = $mainMod SHIFT, B, exec, $HOME/.config/scripts/bookmarks/bookmarkthis

bind = $mainMod, Q, killactive, 
bind = $mainMod SHIFT, Q, exit, 
bind = $mainMod SHIFT CONTROL, L, exec, hyprctl dispatch dpms toggle
bind = $mainMod, space, togglefloating, 
bind = $mainMod, T, togglesplit, # dwindle
bind = ALT, Tab, cyclenext,
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = ALT, Tab, bringactivetotop,
bind = $mainMod SHIFT, F, fullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to a workspace with mainMod + CTRL + SHIFT + [0-7]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move active window with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Swap windows with mainMod + ALT + SHIFT + arrow keys
bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, J, swapwindow, d
bind = $mainMod ALT, K, swapwindow, u
bind = $mainMod ALT, L, swapwindow, r

# Resizing
binde = $mainMod CTRL, H, resizeactive, -20 0
binde = $mainMod CTRL, J, resizeactive, 0 20
binde = $mainMod CTRL, K, resizeactive, 0 -20
binde = $mainMod CTRL, L, resizeactive, 20 0

# Volume up/down
bindel=$mainMod, equal, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel=$mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Change songs
bindel=ALT, comma, exec, ~/.config/hypr/scripts/music-player-client previous
bindel=ALT , period, exec, ~/.config/hypr/scripts/music-player-client next
bindel=ALT, SPACE, exec, ~/.config/hypr/scripts/music-player-client play-pause
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = $mainMod, p, exec, playerctl play-pause

# Example special workspace (scratchpad)
exec-once = hyprctl keyword workspace special:magic, on-created-empty, ~/.config/scripts/scratch.sh
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
